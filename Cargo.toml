[package]
name = "next-hunk"
version = "0.1.0"
edition = "2021"
description = "High-performance terminal review engine for large changesets"
license = "MIT"
readme = "README.md"
keywords = ["diff", "git", "tui", "review", "performance"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[lib]
name = "next_hunk"
path = "src/lib.rs"

[[bin]]
name = "next-hunk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
gix = "0.85"
ratatui = "0.29"
# syntect: syntax highlighting. Optional behind the `highlight` feature.
# Uncomment when network is available to fetch it; the TUI gracefully
# degrades to plain text when the feature is off.
# syntect = { version = "5.2", default-features = false, features = ["default-fancy"], optional = true }
thiserror = "2"
unicode-width = "0.2"

[features]
default = []
# Syntax highlighting via syntect. Uncomment the dependency above AND set this
# to `default = ["highlight"]` to turn on highlighting. When off, the TUI
# renders plain text and the highlight toggle is inert.
highlight = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

# Release profile: optimize for runtime speed of the review path.
# Binary size is not a product goal — do not use panic="abort"/extreme strip
# policies as architecture constraints.
[profile.release]
lto = "thin"

# Benches (PERF.md §3). `harness = false` so criterion_main! drives main().
[[bench]]
name = "parse"
harness = false

[[bench]]
name = "viewport"
harness = false
