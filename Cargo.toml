[package]
name = "next-hunk"
version = "0.4.0"
edition = "2021"
description = "High-performance terminal review engine for large changesets"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wuxiaobai24/next-hunk"
homepage = "https://github.com/wuxiaobai24/next-hunk"
documentation = "https://github.com/wuxiaobai24/next-hunk#readme"
keywords = ["diff", "git", "tui", "review", "performance"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
# Keep the crates.io package lean: skip agent/runtime notes and the Homebrew
# formula (distribution metadata, not needed to build or test the crate).
exclude = [
  "AGENTS.md",
  "Formula/",
  ".agent_context/",
  ".grok/",
  ".multica/",
  ".spec-workflow/",
]

[lib]
name = "next_hunk"
path = "src/lib.rs"

[[bin]]
name = "next-hunk"
path = "src/main.rs"

# Short alias binary: same program, typed as `nh`. A drop-in replacement for
# `git diff` wants a short name (`nh diff main...feat -- src/`).
[[bin]]
name = "nh"
path = "src/bin/nh.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
crossterm = "0.28"
gix = "0.85"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
# serde_json: serialize `--select` decisions to stdout for the agent to consume.
serde_json = "1"
# syntect: pure-Rust regex engine (default-fancy) — no Oniguruma C toolchain.
# Optional behind the `highlight` feature so constrained/offline environments
# can build without it (the TUI gracefully degrades to plain text).
syntect = { version = "5.2", default-features = false, features = ["default-fancy"], optional = true }
thiserror = "2"
unicode-width = "0.2"
# toml: parse layered config.toml (user + project). Pure-Rust, small.
toml = "0.8"
# notify: filesystem watcher for `--watch` mode. Optional behind the `watch`
# feature so constrained/offline environments can build without it (the `--watch`
# flag then reports that the feature is not compiled in).
notify = { version = "6", optional = true }

[features]
default = ["highlight", "watch", "serve", "mcp"]
# Syntax highlighting via syntect. When disabled, the TUI renders plain text
# (highlight toggle is inert).
highlight = ["dep:syntect"]
# Live reload in `--watch` mode via notify. On by default so the headline
# `--watch` flag works out of the box; when disabled, `--watch` reports that
# the feature is not compiled in.
watch = ["dep:notify"]
# Optional server mode (`next-hunk serve` + `push`/`decision`) for live
# agent→human streaming into a persistent TUI. Uses std Unix sockets (no new
# crate). Subcommands exist on all OSes; non-Unix builds error with a message
# that points at docs/PLATFORMS.md (Windows live serve deferred to 0.9).
serve = []
# Lightweight MCP stdio server (`next-hunk mcp`) mapping serve session commands
# to MCP tools. Zero extra crates (JSON-RPC over stdio via serde_json). Tools
# still need `serve` + Unix at runtime (same matrix as CLI). Omit with
# `--no-default-features --features serve` (or without `mcp`) for lean builds.
mcp = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# cargo-husky: auto-installs a .git/hooks/pre-commit that runs `cargo fmt
# --check` and `cargo clippy -- -D warnings` on the first `cargo test`. Keeps
# the rustfmt/clippy drift out of commits (and CI) without anyone remembering
# to wire up a hook by hand. Pure build-script crate — no runtime dep, no
# effect on release artifacts or the --no-default-features build.
#   precommit-hook   -> install on pre-commit (not pre-push)
#   run-cargo-fmt    -> `cargo fmt -- --check`
#   run-cargo-clippy -> `cargo clippy -- -D warnings`
# default-features = false drops the default prepush-hook + run-cargo-test +
# run-for-all, which we don't want here.
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy"] }

# Release profile: optimize for runtime speed of the review path.
# Binary size is not a product goal — do not use panic="abort"/extreme strip
# policies as architecture constraints.
[profile.release]
lto = "thin"

# Distribution profile: for shipped static binaries (musl). Trades a little
# build time and runtime perf for a much smaller binary — fat LTO, symbol
# stripping, and abort-on-panic (drops the unwinder). CI builds the release
# artifacts with `--profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Benches (PERF.md §3). `harness = false` so criterion_main! drives main().
[[bench]]
name = "parse"
harness = false

[[bench]]
name = "viewport"
harness = false
