name: release

# Build a fully-static, all-features musl binary and attach it to a GitHub
# Release whenever a `v*` tag is pushed. The binary is pure-Rust (gix, not
# libgit2; syntect default-fancy, not oniguruma; zlib-rs, not C zlib), so no C
# cross-toolchain is needed — a standard ubuntu runner + the musl rust-std
# target produces a `statically linked` ELF.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed by softprops/action-gh-release to create the Release

env:
  CARGO_TERM_COLOR: always

jobs:
  musl-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-dist

      # `--profile dist` = fat LTO + strip + panic=abort (see Cargo.toml).
      # `--all-features` = highlight + watch, the full default feature set.
      - name: Build static musl binary (all features)
        run: cargo build --profile dist --all-features --target x86_64-unknown-linux-musl

      - name: Verify static linkage
        run: |
          bin="target/x86_64-unknown-linux-musl/dist/next-hunk"
          file "$bin"
          ldd "$bin" || true
          "$bin" --version

      - name: Stage dist artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="next-hunk-${version}-x86_64-musl"
          mkdir -p "$dir"
          cp target/x86_64-unknown-linux-musl/dist/next-hunk "$dir/"
          cp README.md LICENSE CHANGELOG.md "$dir/"
          tar -caf "next-hunk-${version}-x86_64-musl.tar.xz" "$dir"
          shasum -a 256 "next-hunk-${version}-x86_64-musl.tar.xz" > \
            "next-hunk-${version}-x86_64-musl.tar.xz.sha256"
          echo "version=$version" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            next-hunk-${{ env.version }}-x86_64-musl.tar.xz
            next-hunk-${{ env.version }}-x86_64-musl.tar.xz.sha256
