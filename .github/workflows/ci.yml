name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Avoid fetching the full history; CI only needs the worktree.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `-D warnings` is set via RUSTFLAGS, so any clippy lint fails the build.
      - run: cargo clippy --all-targets --all-features

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all-features --no-fail-fast
        # Backstop: if a test hangs (e.g. a stdin/pipe deadlock that only
        # manifests on one OS), fail the job in minutes instead of running
        # to GitHub's 6h cap. Normal runs finish in well under 10 min.
        timeout-minutes: 10

  # Perf gate: generate the deterministic huge fixture (gitignored, pure
  # awk — no Windows/macOS shell assumptions, so this lives on ubuntu) and
  # run the timing-asserted huge-fixture test. The ceilings are loose
  # debug-build bounds (see tests/golden.rs) — precise numbers stay in
  # docs/PERF.md via `cargo bench`. This is what makes the ARCHITECTURE
  # "regressions fail CI" promise real.
  perf-gate:
    name: perf gate (huge fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: generate fixtures
        run: ./scripts/gen_fixtures.sh
      - name: run huge-fixture gate
        run: cargo test --all-features --test golden huge_fixture -- --nocapture
        timeout-minutes: 10

  # Verify the crate builds with no default features — the headline
  # `--watch` and syntax-highlight flags must degrade gracefully, not break
  # the build, for constrained/offline environments.
  minimal:
    name: build (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features
      - run: cargo build --no-default-features --features highlight
